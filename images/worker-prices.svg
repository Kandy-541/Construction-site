<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4562a" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#ddd" stroke-width="2" />
  
  <!-- Abstract Design Element -->
  <path d="M 30,120 A 70,70 0 0,1 170,120 Z" fill="url(#primaryGrad)" opacity="0.1" />

  <!-- Worker Body -->
  <path d="M 50,180 C 50,145 65,135 90,135 C 115,135 130,145 130,180 Z" fill="#34495e" />
  <!-- Collar -->
  <path d="M 80,135 L 90,150 L 100,135 Z" fill="#ecf0f1" />
  
  <!-- Neck -->
  <rect x="82" y="120" width="16" height="15" fill="#f5cba7" />
  
  <!-- Head -->
  <circle cx="90" cy="110" r="20" fill="#f5cba7" />
  
  <!-- Hard Hat -->
  <path d="M 68,100 C 68,75 112,75 112,100 Z" fill="#f39c12" />
  <ellipse cx="90" cy="100" rx="26" ry="4" fill="#f39c12" />
  
  <!-- Blueprint/Scroll -->
  <path d="M 40,150 L 110,165 L 100,180 L 30,165 Z" fill="#3498db" />
  <line x1="50" y1="158" x2="95" y2="168" stroke="#fff" stroke-dasharray="3,3" />
  <line x1="45" y1="162" x2="90" y2="172" stroke="#fff" stroke-width="2" />

  <!-- Gold Savings Coin -->
  <circle cx="145" cy="115" r="22" fill="url(#goldGrad)" stroke="#d35400" stroke-width="2" />
  <circle cx="145" cy="115" r="16" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4,2" />
  <!-- Currency symbol "C" (representing FCFA) or tag -->
  <text x="145" y="122" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">FCFA</text>
</svg>
