<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4562a" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#ddd" stroke-width="2" />
  
  <!-- Abstract Design Element -->
  <path d="M 30,120 A 70,70 0 0,1 170,120 Z" fill="url(#primaryGrad)" opacity="0.1" />

  <!-- Worker 1 (Left background) -->
  <path d="M 40,180 C 40,145 55,138 75,138 C 95,138 105,145 110,180 Z" fill="#7f8c8d" />
  <rect x="70" y="125" width="12" height="15" fill="#e8a87c" />
  <circle cx="76" cy="118" r="15" fill="#e8a87c" />
  <path d="M 60,110 C 60,95 92,95 92,110 Z" fill="#95a5a6" />
  
  <!-- Worker 2 (Right main) -->
  <path d="M 90,180 C 90,140 105,130 130,130 C 155,130 170,140 170,180 Z" fill="#34495e" />
  <rect x="122" y="115" width="16" height="15" fill="#f5cba7" />
  <circle cx="130" cy="105" r="20" fill="#f5cba7" />
  <path d="M 108,95 C 108,70 152,70 152,95 Z" fill="#d35400" />
  <ellipse cx="130" cy="95" rx="26" ry="4" fill="#d35400" />

  <!-- Star rating overlay -->
  <polygon points="100,35 105,48 119,48 108,56 112,69 100,60 88,69 92,56 81,48 95,48" fill="url(#starGrad)" stroke="#f39c12" stroke-width="1" />
  <polygon points="65,42 69,52 80,52 71,59 74,69 65,62 56,69 59,59 50,52 61,52" fill="url(#starGrad)" stroke="#f39c12" stroke-width="1" />
  <polygon points="135,42 139,52 150,52 141,59 144,69 135,62 126,69 129,59 120,52 131,52" fill="url(#starGrad)" stroke="#f39c12" stroke-width="1" />
</svg>
