<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4562a" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#ddd" stroke-width="2" />
  
  <!-- Abstract Design Element -->
  <path d="M 30,120 A 70,70 0 0,1 170,120 Z" fill="url(#primaryGrad)" opacity="0.1" />

  <!-- Worker Body -->
  <path d="M 60,180 C 60,140 75,130 100,130 C 125,130 140,140 140,180 Z" fill="#2c3e50" />
  <!-- Shirt/Collar -->
  <path d="M 90,130 L 100,145 L 110,130 Z" fill="#ecf0f1" />
  
  <!-- Neck -->
  <rect x="92" y="115" width="16" height="15" fill="#f5cba7" />
  
  <!-- Head -->
  <circle cx="100" cy="105" r="20" fill="#f5cba7" />
  
  <!-- Ears -->
  <circle cx="79" cy="105" r="4" fill="#f5cba7" />
  <circle cx="121" cy="105" r="4" fill="#f5cba7" />
  
  <!-- Safety Goggles -->
  <rect x="85" y="98" width="30" height="8" rx="3" fill="#3498db" opacity="0.8" />
  <rect x="83" y="101" width="34" height="2" fill="#2980b9" />
  
  <!-- Hard Hat -->
  <path d="M 78,95 C 78,70 122,70 122,95 Z" fill="url(#hatGrad)" />
  <ellipse cx="100" cy="95" rx="26" ry="4" fill="url(#hatGrad)" />
  <path d="M 98,72 L 102,72 L 102,91 L 98,91 Z" fill="#e67e22" />

  <!-- Clipboard (Quality Check) -->
  <rect x="120" y="110" width="45" height="60" rx="3" fill="#7f8c8d" />
  <rect x="125" y="118" width="35" height="46" fill="#fff" />
  <!-- Clipboard clip -->
  <rect x="135" y="105" width="15" height="8" rx="2" fill="#34495e" />
  <!-- Lines on page -->
  <line x1="130" y1="125" x2="155" y2="125" stroke="#7f8c8d" stroke-width="2" />
  <line x1="130" y1="133" x2="150" y2="133" stroke="#7f8c8d" stroke-width="2" />
  <line x1="130" y1="141" x2="155" y2="141" stroke="#7f8c8d" stroke-width="2" />
  
  <!-- Checkmark -->
  <path d="M 132,157 L 138,162 L 152,150" fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
